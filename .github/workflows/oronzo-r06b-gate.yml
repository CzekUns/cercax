name: ORONZO R06B combined native gate
on:
  push:
    branches: [audit/oronzo-r06b-gate]
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Checkout merged main
        run: |
          git fetch origin main
          git checkout origin/main -- oronzo
          git rev-parse origin/main
          git status --short
      - name: Native flow and E2E
        run: node --test oronzo/app/flow/tests/*.mjs
      - name: Native career and coach club
        run: node --test oronzo/systems/career/tests/*.mjs oronzo/systems/coach-club/*.test.js
      - name: Real demo
        run: node oronzo/app/flow/demo-r03.mjs
