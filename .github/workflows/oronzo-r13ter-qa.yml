name: ORONZO R13-TER raster portrait integration
on:
  pull_request:
    paths:
      - 'oronzo/**'
      - '.github/workflows/oronzo-r13ter-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raster-portrait-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python raster integrity and exact committed Git hashes
        run: |
          python -m pip install pillow
          python oronzo/assets/players/r13/tests/test_raster_assets.py
      - name: Native portrait regressions and R12 identities
        run: |
          node --check oronzo/assets/ui/sections-r11/portrait-r13.js
          node --check oronzo/assets/ui/qa/r13ter-browser.mjs
          node --test oronzo/assets/ui/sections-r11/portrait-r13.test.mjs oronzo/assets/ui/sections-r11/portrait-r13ter.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright fake-indexeddb
          npx playwright install --with-deps chromium
      - name: Real game HTTP in four landscape viewports
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/oronzo-r13ter-http.log 2>&1 &
          sleep 2
          node oronzo/assets/ui/qa/r13ter-browser.mjs
      - name: Publish screenshot and QA evidence as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oronzo-r13ter-evidence
          path: r13ter-evidence/
          if-no-files-found: ignore
