name: ORONZO R05B combined Node gate
on:
  push:
    branches:
      - audit/oronzo-r05b-gate-blocked
jobs:
  combined:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout merged main
        run: |
          git fetch origin main
          git checkout origin/main -- oronzo
          git rev-parse origin/main
          git status --short
      - name: Node combined tests on merged main
        run: node --test oronzo/systems/career/tests/*.mjs oronzo/systems/coach-club/*.test.js
